name: check

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "test/antithesis/**"
      - "test/integration/**"
      - "doc/**"
  pull_request:
    paths-ignore:
      - "test/antithesis/**"
      - "test/integration/**"
      - "doc/**"
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Parallel copies of every matrix cell (flake hunting)'
        required: false
        default: '1'
      repeats:
        description: 'Times to run the check inside one job'
        required: false
        default: '1'
      cpu:
        description: 'Narrow to one CPU (all = the usual dispatch set)'
        type: choice
        options: [all, amd64, arm64]
        default: all
      pg_version:
        description: 'Narrow to one PostgreSQL major'
        type: choice
        options: [all, '16', '17', '18']
        default: all
      compiler:
        description: 'Narrow to one compiler'
        type: choice
        options: [all, clang, gcc]
        default: all
      check_type:
        description: 'Narrow to one check type'
        type: choice
        options: [all, normal, debug, sanitize, check_page]
        default: all

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: python
        env:
          FANOUT: ${{ github.event.inputs.jobs || '1' }}
          SEL_CPU: ${{ github.event.inputs.cpu || 'all' }}
          SEL_PG: ${{ github.event.inputs.pg_version || 'all' }}
          SEL_COMP: ${{ github.event.inputs.compiler || 'all' }}
          SEL_CT: ${{ github.event.inputs.check_type || 'all' }}
          REPEATS: ${{ github.event.inputs.repeats || '1' }}
        run: |
          import os, json, itertools

          event_name = os.environ["GITHUB_EVENT_NAME"]
          ref        = os.environ.get("GITHUB_REF_NAME", "")

          # Standart GitHub Hosted runner'larda timeout ve kernel uyumsuzluğu 
          # yaratan valgrind, pg_tests ve dm_log_writes çıkarıldı:
          check_types = [
              "normal", "debug", "sanitize", "check_page"
          ]

          try:
              fanout = int(os.environ.get("FANOUT") or 1)
          except ValueError:
              fanout = 1
          fanout = max(1, fanout)

          try:
              repeats = int(os.environ.get("REPEATS") or 1)
          except ValueError:
              repeats = 1
          repeats = max(1, repeats)

          sel = {
              "cpu": os.environ.get("SEL_CPU") or "all",
              "pg_version": os.environ.get("SEL_PG") or "all",
              "compiler": os.environ.get("SEL_COMP") or "all",
              "check_type": os.environ.get("SEL_CT") or "all",
          }
          narrowed = any(v != "all" for v in sel.values())

          def keep(cell):
              return all(v == "all" or str(cell[k]) == v for k, v in sel.items())

          def make_matrix(combos):
              global fanout

              cells = [
                  cell
                  for (cpu, pg, comp), ct in itertools.product(combos, check_types)
                  for cell in [{"cpu": cpu, "pg_version": pg,
                                "compiler": comp, "check_type": ct}]
                  if keep(cell)
              ]
              if not cells:
                  raise SystemExit(f"::error::no matrix cell matches {sel}")

              for cell in cells:
                  ct = cell["check_type"]
                  base = 40 if ct == "sanitize" else 30
                  budget = base * repeats
                  if budget > 350:
                      budget = 350
                  cell["timeout"] = budget
                  cell["copies"] = fanout

              limit = max(1, 256 // len(cells))
              if fanout > limit:
                  fanout = limit

              return {
                  "include": [
                      dict(cell, run=r)
                      for r, cell in itertools.product(range(1, fanout + 1), cells)
                  ]
              }

          full_combos = list(itertools.product(
              ["amd64", "arm64"], [16, 17, 18], ["clang", "gcc"]
          ))

          sha_hex = os.environ.get("GITHUB_SHA", "0") or "0"
          flip = int(sha_hex[:8], 16) % 2
          older_a = ("amd64", "gcc") if flip == 0 else ("arm64", "clang")
          older_b = ("arm64", "clang") if flip == 0 else ("amd64", "gcc")
          branch_combos = [
              (older_a[0], 16, older_a[1]),
              (older_b[0], 17, older_b[1]),
              ("amd64", 18, "gcc"),
              ("arm64", 18, "clang"),
          ]

          pr_combos = [
              ("arm64", 16, "gcc"),
              ("amd64", 16, "clang"),
              ("arm64", 17, "gcc"),
              ("amd64", 17, "clang"),
              ("arm64", 18, "gcc"),
              ("amd64", 18, "clang"),
          ]

          if event_name == "workflow_dispatch" and narrowed:
              combos = full_combos
          elif event_name == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"]) as f:
                  pr_event = json.load(f)
              head_repo = pr_event["pull_request"]["head"]["repo"]["full_name"]
              base_repo = pr_event["pull_request"]["base"]["repo"]["full_name"]
              combos = full_combos if head_repo != base_repo else pr_combos
          elif ref == "main":
              combos = full_combos
          else:
              combos = branch_combos

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(make_matrix(combos))}\n")

  check:
    needs: matrix
    name: "check (${{ matrix.cpu }}, ${{ matrix.pg_version }}, ${{ matrix.compiler }}, ${{ matrix.check_type }})${{ matrix.copies > 1 && format(' #{0}', matrix.run) || '' }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    runs-on: ubuntu-24.04
    env:
      LLVM_VER: 18
      CPU: ${{ matrix.cpu }}
      CHECK_TYPE: ${{ matrix.check_type }}
      PG_VERSION: ${{ matrix.pg_version }}
      COMPILER: ${{ matrix.compiler }}
    steps:
      - name: Checkout extension code into workspace directory
        uses: actions/checkout@v6
        with:
          path: orioledb

      - name: Get the required tag name
        shell: bash
        run: |
          echo "PGTAG=$(grep '^${{ matrix.pg_version }}: ' orioledb/.pgtags | cut -d' ' -f2-)" >> $GITHUB_ENV

      - name: Checkout PostgreSQL code into workspace directory
        uses: actions/checkout@v6
        with:
          repository: orioledb/postgres
          ref: ${{ env.PGTAG }}
          path: postgresql

      - name: Setup prerequisites
        run: bash ./orioledb/ci/prerequisites.sh

      - name: Build
        run: bash ./orioledb/ci/build.sh

      - name: Install post build prerequisites
        run: bash ./orioledb/ci/post_build_prerequisites.sh

      - name: Check
        timeout-minutes: ${{ matrix.timeout }}
        env:
          REPEATS: ${{ github.event.inputs.repeats || '1' }}
        run: bash ./orioledb/ci/check.sh

      - name: Check output
        run: bash ./orioledb/ci/check_output.sh
        if: ${{ success() || failure() }}

      - name: Upload tests diffs
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.pg_version }}_${{ matrix.cpu }}_${{ matrix.compiler }}_${{ matrix.check_type }}_r${{ matrix.run }}_test.diffs
          path: |
            ./orioledb/test/**/regression.diffs
            ./orioledb/test/**/isolation_filtered.diffs
            ./postgresql/src/test/**/regression.diffs
            ./postgresql/src/test/**/isolation_filtered.diffs
            ./postgresql/dump_diff_*.txt
          retention-days: 2
          if-no-files-found: ignore

      - name: Upload tests logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.pg_version }}_${{ matrix.cpu }}_${{ matrix.compiler }}_${{ matrix.check_type }}_r${{ matrix.run }}_test.logs
          path: |
            ./orioledb/test/tmp_check_t/*/logs/*log
            ./orioledb/test/tmp_check/log/*log
            ./orioledb/test/tmp_check_iso/log/*log
            ./orioledb/test/log/*.log
            ./postgresql/pg.log
            ./postgresql/rep_pg.log
            ./postgresql/src/test/**/tmp_check/*.dump
            ./postgresql/src/test/**/tmp_check/log/*
          retention-days: 2
          if-no-files-found: ignore

      - name: Show stuck processes
        run: bash ./orioledb/ci/list_stuck.sh
        if: ${{ always() }}

      - name: Run lcov
        if: ${{ matrix.check_type != 'sanitize' && matrix.check_type != 'check_page' }}
        run: bash ./orioledb/ci/lcov.sh

      - name: Create artifact for coverage.info
        if: ${{ matrix.check_type != 'sanitize' && matrix.check_type != 'check_page' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pg_version }}_${{ matrix.cpu }}_${{ matrix.compiler }}_${{ matrix.check_type }}_r${{ matrix.run }}_coverage.info
          path: ./orioledb/coverage.info
          retention-days: 1
          overwrite: true

  finish:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout extension code into workspace directory
        uses: actions/checkout@v6
        with:
          path: orioledb

      - name: Retrieve saved coverage.infos
        uses: actions/download-artifact@v8

      - name: Merge coverage files
        run: bash ./orioledb/ci/lcov_merge.sh

      - name: coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: ./orioledb/coverage.info
          fail-on-error: false

  cleanup:
    needs: finish
    runs-on: ubuntu-24.04
    steps:
      - name: remove artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: "*coverage.info*"
          failOnError: false